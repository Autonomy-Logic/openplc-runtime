per_listener_settings true
log_dest stdout
log_type error
log_type warning
log_type notice
persistence false

listener 1883
allow_anonymous true

listener 8883
certfile /pki/server-ok.crt
keyfile /pki/server-ok.key
allow_anonymous false
password_file /mosquitto/passwd

listener 8884
certfile /pki/server-ok.crt
keyfile /pki/server-ok.key
cafile /pki/client-ca.crt
require_certificate true
use_identity_as_username true

listener 8885
certfile /pki/server-wrong-host.crt
keyfile /pki/server-wrong-host.key
allow_anonymous true

listener 8886
certfile /pki/server-expired.crt
keyfile /pki/server-expired.key
allow_anonymous true

listener 8887
certfile /pki/server-untrusted.crt
keyfile /pki/server-untrusted.key
allow_anonymous true
