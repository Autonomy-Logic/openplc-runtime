name: Base Image Check

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  verify:
    name: Verify Base Image Attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the pinned base image
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-base-image.sh
