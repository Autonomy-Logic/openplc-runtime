name: Build and Publish Multi-Arch Docker Image

on:
  push:
    tags:
      - 'v*'
    # The sidecar has its own version line, so it also builds from a branch
    # push without waiting for a runtime tag. Deliberately no `paths` filter:
    # GitHub applies it to tag pushes as well, which would make the runtime
    # release build conditional on sidecar files having changed. The jobs below
    # gate themselves instead.
    branches:
      - development
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated)'
        default: 'linux/amd64,linux/arm64,linux/arm/v7'
        required: false
        type: string
      release_tag:
        description: 'Release version tag (e.g., 1.2.3). If provided, also tags as latest.'
        required: false
        type: string

jobs:
  build:
    # Release tags and manual runs only -- unchanged from before the sidecar
    # job was added. A branch push produces no semver tag for the metadata
    # step, so letting it through would fail with an empty tag list.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/autonomy-logic/openplc-runtime
          tags: |
            # latest tag only for stable releases (no pre-release suffix like -rc, -beta, etc.)
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || inputs.release_tag != '' }}
            # Version tag from git tag (e.g., v1.2.3 -> v1.2.3, v1.2.3-rc.1 -> v1.2.3-rc.1)
            type=semver,pattern={{raw}}
            # Version tag for manual runs with release_tag
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the GitHub release tag (or the workflow_dispatch
          # release_tag override) into the image so /api/version can
          # report it back to clients.  Falls back to the Dockerfile
          # default ("dev") for ad-hoc builds without a release tag.
          build-args: |
            RUNTIME_VERSION=${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}

  # The sidecar is versioned independently of the runtime (sidecar/VERSION).
  # Tying it to every runtime tag would publish a long run of byte-identical
  # images and make "which sidecar is on this device" a meaningless question.
  sidecar:
    runs-on: ubuntu-latest
    # Runs on release tags AND branch pushes: it is a seconds-long
    # cross-compile, and re-pushing an unchanged sidecar/VERSION is an
    # idempotent overwrite.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read sidecar version
        id: sidecar_version
        run: echo "version=$(tr -d '[:space:]' < sidecar/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # No QEMU step, unlike the runtime build: the sidecar is pure Go and
      # cross-compiles from the native runner for every target, which takes
      # seconds instead of the many minutes emulation costs.
      - name: Build and Push Sidecar
        uses: docker/build-push-action@v6
        with:
          context: ./sidecar
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          build-args: |
            SIDECAR_VERSION=${{ steps.sidecar_version.outputs.version }}
          tags: |
            ghcr.io/autonomy-logic/openplc-runtime-sidecar:${{ steps.sidecar_version.outputs.version }}
            ghcr.io/autonomy-logic/openplc-runtime-sidecar:latest
