# Modbus Slave Plugin Configuration Example
# This file shows how to configure the Modbus slave plugin

[plugin_modbus_slave]
type = PLUGIN_TYPE_PYTHON
path = /home/marcone/Documents/Github/openplc-runtime/core/src/drivers/modbus_slave.py
enabled = true
description = "Modbus TCP Slave server that exposes OpenPLC buffers"

# Network configuration
host = 172.29.65.104
port = 5020

# Buffer mapping configuration  
# Coils (Read/Write) -> bool_output[0-7999] (1000 buffers * 8 bits)
# Discrete Inputs (Read Only) -> bool_input[0-7999] (1000 buffers * 8 bits)
# Holding Registers -> int_output[0-999] (future implementation)
# Input Registers -> int_input[0-999] (future implementation)

max_coils = 8000
max_discrete_inputs = 8000
max_holding_registers = 1000
max_input_registers = 1000
